name: SocialPlan isolated data-safety tests
on:
  push:
    branches: [socialplan-free-persistence-prep]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: socialplan_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: socialplan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialplan_test -d socialplan_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: socialplan_test
      PGPASSWORD: ci-only-password
      PGDATABASE: socialplan_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt 'cryptography>=43,<47' 'httpx>=0.27,<1' 'pytest>=8,<10' 'psycopg[binary]>=3.2,<4'
      - name: Check Python syntax
        run: python -m py_compile app.py extra.py publishing.py instagram_login.py tests/test_content_export.py postgres_store.py pg_api.py tests/test_postgres_store.py tests/test_pg_api.py tests/test_cutover_guard.py
      - name: Run isolated export tests
        run: python -m pytest -q tests/test_content_export.py
      - name: Verify fail-closed database cutover guard
        run: python -m pytest -q tests/test_cutover_guard.py
      - name: Apply PostgreSQL schema twice (idempotency)
        run: |
          psql -v ON_ERROR_STOP=1 -f migrations/postgres/001_initial.sql
          psql -v ON_ERROR_STOP=1 -f migrations/postgres/001_initial.sql
      - name: Verify tables and tenant foreign keys
        run: |
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('businesses','users','sessions','login_attempts','posts','audit_events','publish_jobs','instagram_oauth_states','instagram_connections')) <> 9 THEN RAISE EXCEPTION 'Missing SocialPlan tables'; END IF; END \$\$;"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO businesses(name) VALUES ('CI isolated tenant');"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO users(business_id,email,salt,passhash,role) VALUES (1,'ci@example.test','salt','hash','admin');"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO posts(business_id,author_id,caption,media_url,scheduled_at,status,created_at) VALUES (1,1,'CI content','https://example.test/a.jpg','2027-01-01T00:00:00Z','draft',1);"
      - name: Run PostgreSQL tenant and audit integration tests
        env:
          DATABASE_URL: postgresql://socialplan_test:ci-only-password@localhost:5432/socialplan_ci
        run: python -m pytest -q tests/test_postgres_store.py

      - name: Verify PostgreSQL records survive separate application processes
        env:
          DATABASE_URL: postgresql://socialplan_test:ci-only-password@localhost:5432/socialplan_ci
        run: |
          python scripts/check_pg_restart.py write
          python scripts/check_pg_restart.py read
      - name: Run PostgreSQL HTTP API integration tests
        env:
          DATABASE_URL: postgresql://socialplan_test:ci-only-password@localhost:5432/socialplan_ci
        run: python -m pytest -q tests/test_pg_api.py
      - name: Verify backup and restore in a second disposable PostgreSQL database
        env:
          DATABASE_URL: postgresql://socialplan_test:ci-only-password@localhost:5432/socialplan_ci
        run: |
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO businesses(name) VALUES ('socialplan-ci-backup-marker')"
          pg_dump --format=custom --no-owner --no-acl --file=/tmp/socialplan-ci.dump socialplan_ci
          createdb socialplan_ci_restored
          pg_restore --no-owner --no-acl --exit-on-error --dbname=socialplan_ci_restored /tmp/socialplan-ci.dump
          test "$(psql -v ON_ERROR_STOP=1 -d socialplan_ci_restored -tAc "SELECT count(*) FROM businesses WHERE name='socialplan-ci-backup-marker'")" = "1"
          rm -f /tmp/socialplan-ci.dump

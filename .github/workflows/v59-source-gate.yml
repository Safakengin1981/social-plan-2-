name: SocialPlan 5.9 source gate
on:
  push:
    branches: [socialplan-v59-dashboard-safe]
  pull_request:
    branches: [socialplan-v59-dashboard-safe]
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 5.9 source and safe Docker build
        shell: bash
        run: |
          set -euo pipefail
          for file in app.py static/index.html static/app.js tests/test_app.py instagram_oauth.py deployment_gate.py requirements-test.txt; do
            test -f "$file" || { echo "Required 5.9 file missing: $file"; exit 1; }
          done
          if grep -q 'SocialPlan_5_8_Yeniden_Baslatma_Testi.zip.zip' Dockerfile; then
            echo 'Dockerfile still builds the 5.8 archive; release blocked'
            exit 1
          fi
          if find . -path './.git' -prune -o -type f \( -name '*.sqlite3' -o -name '*.pem' -o -name '.env' \) -print | grep -q .; then
            echo 'Potential private data or secret committed; release blocked'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run full tests
        env:
          SOCIALPLAN_DB: ${{ runner.temp }}/socialplan-ci.sqlite3
        run: python -m pytest -q

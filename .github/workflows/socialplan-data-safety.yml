name: SocialPlan isolated data-safety tests
on:
  push:
    branches: [socialplan-free-persistence-prep]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt 'cryptography>=43,<47' 'httpx>=0.27,<1' 'pytest>=8,<10'
      - name: Check Python syntax
        run: python -m py_compile app.py extra.py publishing.py instagram_login.py tests/test_content_export.py
      - name: Run isolated export tests
        run: python -m pytest -q tests/test_content_export.py
